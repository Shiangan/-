<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花籃訂購與輓聯登記</title>
    <style>
        /* Base Styles */
        body { 
            font-family: 'Noto Sans TC', '微軟正黑體', Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f8f9fa; 
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #5cb85c; /* 綠色調 */
            margin-bottom: 5px;
            border-bottom: 2px solid #5cb85c;
            padding-bottom: 10px;
        }
        h2 {
            font-size: 1.3em;
            color: #4a4a4a;
            margin-top: 25px;
            border-left: 4px solid #f0ad4e;
            padding-left: 10px;
        }

        /* Form Elements */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }
        textarea {
            resize: vertical;
        }

        /* Flower Options */
        .flower-options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            justify-content: space-around;
        }
        .flower-card {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 15px;
            width: 45%; /* 確保一行顯示兩個 */
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .flower-card.selected {
            border-color: #5cb85c;
            background-color: #eaffea;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .flower-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .flower-card input[type="radio"] {
            margin-right: 8px;
        }
        .flower-card label {
            display: inline;
            font-weight: normal;
        }
        
        /* Submit Button */
        button[type="submit"] {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 30px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #449d44;
        }
        .info-bar {
            background-color: #f0f8ff;
            border: 1px solid #cce5ff;
            color: #004085;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>花籃訂購與輓聯登記</h1>
        <div class="info-bar">
            弔唁故 <span id="deceasedNameDisplay"></span> <span id="deceasedGenderTitleDisplay"></span> (會場：<span id="funeralLocationDisplay"></span>)
        </div>

        <form id="flowerOrderForm">
            
            <h2>👤 弔唁者/訂購人資訊</h2>
            <label for="orderName">訂購人姓名 (輓聯署名):</label>
            <input type="text" id="orderName" required>

            <label for="orderContact">連絡電話:</label>
            <input type="tel" id="orderContact" required>
            
            <label for="orderEmail">Email (選填，用於接收確認信):</label>
            <input type="email" id="orderEmail">

            <label for="relationship">與亡者關係 (例如: 朋友、公司):</label>
            <input type="text" id="relationship" required>

            <h2>💐 花籃選擇</h2>
            <p id="flowerInstruction">請選擇您希望訂購的花籃樣式:</p>
            <div class="flower-options" id="flowerOptionsContainer">
                </div>

            <h2>📝 輓聯內容 (選填)</h2>
            <label for="couplet">輓聯上款 (弔唁詞，例如: 典範長存):</label>
            <input type="text" id="couplet" placeholder="留空則使用公版">
            
            <label for="note">備註/特殊需求 (選填):</label>
            <textarea id="note" rows="3" placeholder="例如: 希望送達時間、收據需求..."></textarea>

            <button type="submit">確認訂購與登記</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dataString = localStorage.getItem('fubenData');
            if (!dataString) {
                alert('訃聞數據遺失，無法載入訂購資訊。請返回輸入頁。');
                return;
            }
            const data = JSON.parse(dataString);
            
            // 數據綁定到頂部資訊欄
            document.getElementById('deceasedNameDisplay').textContent = data.name;
            document.getElementById('deceasedGenderTitleDisplay').textContent = data.gender === '女' ? '女士' : '先生';
            document.getElementById('funeralLocationDisplay').textContent = data.funeralLocation;

            // 處理花籃選項的動態生成
            const container = document.getElementById('flowerOptionsContainer');
            const instruction = document.getElementById('flowerInstruction');
            
            if (data.unifiedFlower === '是' && data.flowerStyles) {
                // 統一製作模式：只顯示勾選的樣式
                instruction.innerHTML = '本次喪禮採 **統一製作** 花籃，僅提供以下樣式 (<span style="color: red;">'+ data.flowerStyles +'</span>) 選擇。';
                
                const availableStyles = data.flowerStyles.split(', ').filter(s => s.trim() !== '');
                
                if (availableStyles.length > 0) {
                    availableStyles.forEach((style, index) => {
                        const styleCode = style.trim();
                        const card = document.createElement('div');
                        card.className = 'flower-card';
                        card.innerHTML = `
                            <img src="image/flower_style_${styleCode.toLowerCase()}.jpg" alt="花籃樣式 ${styleCode}" onerror="this.onerror=null;this.src='image/default_flower.jpg';">
                            <input type="radio" id="style${styleCode}" name="flowerStyle" value="${styleCode}" ${index === 0 ? 'checked' : ''}>
                            <label for="style${styleCode}">樣式 ${styleCode}</label>
                        `;
                        container.appendChild(card);
                        
                        // 點擊卡片時選擇 radio button
                        card.addEventListener('click', function() {
                            document.getElementById(`style${styleCode}`).checked = true;
                            // 移除其他卡片的 selected class
                            document.querySelectorAll('.flower-card').forEach(c => c.classList.remove('selected'));
                            // 為當前卡片添加 selected class
                            card.classList.add('selected');
                        });
                        // 預設選中第一個
                        if (index === 0) {
                            card.classList.add('selected');
                        }
                    });
                } else {
                    instruction.textContent = '本次喪禮雖為統一製作，但未設定可選花籃樣式，請直接填寫輓聯資訊。';
                }

            } else {
                // 開放自訂模式：顯示更多預設樣式供選擇
                instruction.innerHTML = '本次喪禮採 **開放自訂** 花籃。以下為建議樣式，您亦可於備註填寫特殊需求。';
                
                // 假設開放模式提供 A, B, C, D 四種預設樣式
                ['A', 'B', 'C', 'D'].forEach((style, index) => {
                    const card = document.createElement('div');
                    card.className = 'flower-card';
                    card.innerHTML = `
                        <img src="image/flower_style_${style.toLowerCase()}.jpg" alt="花籃樣式 ${style}" onerror="this.onerror=null;this.src='image/default_flower.jpg';">
                        <input type="radio" id="style${style}" name="flowerStyle" value="${style}" ${index === 0 ? 'checked' : ''}>
                        <label for="style${style}">樣式 ${style}</label>
                    `;
                    container.appendChild(card);
                    
                    card.addEventListener('click', function() {
                        document.getElementById(`style${style}`).checked = true;
                        document.querySelectorAll('.flower-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                    });
                     if (index === 0) {
                        card.classList.add('selected');
                    }
                });
            }


            // 表單提交處理 (模擬訂購)
            document.getElementById('flowerOrderForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const orderData = {
                    orderName: document.getElementById('orderName').value,
                    orderContact: document.getElementById('orderContact').value,
                    orderEmail: document.getElementById('orderEmail').value,
                    relationship: document.getElementById('relationship').value,
                    selectedStyle: document.querySelector('input[name="flowerStyle"]:checked')?.value || '未選擇',
                    couplet: document.getElementById('couplet').value || '使用公版',
                    note: document.getElementById('note').value,
                    // 帶入訃聞關鍵資訊
                    deceasedName: data.name,
                    funeralLocation: data.funeralLocation,
                    funeralDate: data.funeralDate,
                };

                // 在實際應用中，這裡會是 AJAX 請求將數據發送到伺服器 (例如 Google Sheet, 資料庫, 或 Email 服務)
                console.log('--- 模擬訂購數據發送 ---');
                console.log(orderData);
                console.log('---------------------------');

                alert(`✅ 感謝 ${orderData.orderName}，花籃訂購與輓聯登記成功！\n您選擇的樣式是: ${orderData.selectedStyle}\n您的訂單已轉交禮儀師處理。`);
                
                // 成功後可以跳轉回訃聞頁面或顯示確認訊息
                window.location.href = 'fuben_display.html';
            });
        });
    </script>
</body>
</html>
