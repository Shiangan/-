<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訃聞資訊輸入與連結生成器 - 祥安生命</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #357AB8;
            --background-light: #F8F9FA;
            --text-dark: #333;
            --border-color: #E0E0E0;
            --font-family-main: 'Noto Serif TC', serif;
        }

        body {
            font-family: var(--font-family-main);
            background-color: var(--background-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .section-header {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 15px;
            margin: 20px -30px 20px -30px; /* 延伸到容器邊緣 */
            border-radius: 0;
            font-size: 1.2em;
            font-weight: 700;
            text-align: left;
            border-left: 8px solid #FFC107; /* 醒目裝飾 */
        }

        .form-group {
            margin-bottom: 20px;
            padding: 5px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
            outline: none;
        }

        textarea {
            min-height: 100px;
        }

        .input-group {
            display: flex;
            gap: 20px;
        }

        .input-group > .form-group {
            flex: 1;
        }

        /* 檔案/路徑輸入的特殊樣式 */
        .path-note {
            font-size: 0.85em;
            color: #E91E63;
            margin-top: 5px;
            font-weight: normal;
        }

        /* 按鈕樣式 */
        #generate-url {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 30px;
            font-weight: 700;
        }

        #generate-url:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        /* 結果區塊 */
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            background-color: #EAF3FF;
            text-align: center;
        }

        #result-url {
            display: block;
            word-break: break-all;
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            text-align: left;
        }

        #copy-button, #jump-button {
            padding: 10px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            transition: opacity 0.3s, background-color 0.3s;
        }

        #copy-button {
            background-color: #28A745;
            color: white;
        }

        #jump-button {
            background-color: #FFC107;
            color: var(--text-dark);
        }

        #copy-button:hover { background-color: #1E7E34; }
        #jump-button:hover { background-color: #E0A800; }

        /* 必填標記 */
        .required::after {
            content: '*';
            color: red;
            margin-left: 5px;
        }

        /* 響應式調整 */
        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
                gap: 0;
            }
            .container {
                padding: 15px;
            }
            .section-header {
                margin: 20px -15px 20px -15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>雲端訃聞生成工具</h1>
    <p style="text-align: center; color: #E91E63; font-weight: 700;">
        ⚠️ **重要提醒：所有圖片/音訊欄位請填寫伺服器上的** **路徑或完整網址** **，而非上傳 Base64 數據。**
    </p>

    <h2 class="section-header">🕊️ 基本資料與日期</h2>
    <div class="input-group">
        <div class="form-group">
            <label for="name" class="required">亡者姓名</label>
            <input type="text" id="name" placeholder="王小明" required>
        </div>
        <div class="form-group">
            <label for="age" class="required">享年 (歲)</label>
            <input type="text" id="age" placeholder="88" required>
        </div>
    </div>
    <div class="input-group">
        <div class="form-group">
            <label for="deathDate" class="required">辭世日期 (國曆)</label>
            <input type="date" id="deathDate" value="2025-01-01" required>
        </div>
        <div class="form-group">
            <label for="deathLunarDate">辭世日期 (農曆/輔助顯示)</label>
            <input type="text" id="deathLunarDate" placeholder="甲辰年十二月初二">
        </div>
    </div>
    
    <h2 class="section-header">🗓️ 告別式資訊</h2>
    <div class="form-group">
        <label for="funeralDate" class="required">告別式/出殯日期 (國曆)</label>
        <input type="date" id="funeralDate" value="2025-01-15" required>
    </div>
    <div class="input-group">
        <div class="form-group">
            <label for="jiadianTimePhrase" class="required">家奠時間 (例如：上午 08:30)</label>
            <input type="text" id="jiadianTimePhrase" placeholder="上午 08:30" required>
        </div>
        <div class="form-group">
            <label for="gongdianTimePhrase" class="required">公奠時間 (例如：上午 09:00)</label>
            <input type="text" id="gongdianTimePhrase" placeholder="上午 09:00" required>
        </div>
    </div>

    <h2 class="section-header">📍 地點與聯絡人</h2>
    
    <div class="form-group">
        <label for="locationPreset" class="required">主要地點預設選擇</label>
        <select id="locationPreset" onchange="autoFillLocation()" required>
            <option value="">請選擇一個主要地點 (自動填寫地址)</option>
            <option value="banqiao">新北板橋殯儀館</option>
            <option value="sec_taipei">台北市第二殯儀館 (二殯)</option>
            <option value="taoyuan">桃園市殯葬園區</option>
            <option value="zhongli">中壢御殿園</option>
            <option value="custom">自訂地點 (手動輸入)</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="verticalAddress">豎靈地點名稱 (例：新北板橋殯儀館)</label>
        <input type="text" id="verticalAddress" placeholder="新北板橋殯儀館">
    </div>
    <div class="form-group">
        <label for="verticalAddressDetail">豎靈地址 (Google 地圖用)</label>
        <input type="text" id="verticalAddressDetail" placeholder="新北市板橋區新海路135號">
    </div>
    <div class="form-group">
        <label for="funeralLocation" class="required">告別式地點名稱 (例：新北板橋殯儀館-景福廳)</label>
        <input type="text" id="funeralLocation" placeholder="新北板橋殯儀館-景福廳" required>
    </div>
    <div class="form-group">
        <label for="contactAddress" class="required">治喪地址/出殯地址 (Google 地圖用)</label>
        <input type="text" id="contactAddress" placeholder="新北市板橋區新海路135號" required>
    </div>
    <div class="form-group">
        <label for="mapIframeLink">Google Map 內嵌 iframe 連結</label>
        <input type="text" id="mapIframeLink" placeholder="例如：<iframe src='...'> 裡面的 src 內容">
    </div>
    
    <div class="form-group">
        <label for="transportText">主要交通指引文字 (例如：捷運、公車路線)</label>
        <textarea id="transportText" placeholder="填寫大眾運輸路線、接駁車資訊等..."></textarea>
    </div>
    <div class="form-group">
        <label for="parkingText">停車資訊文字 (例如：停車場位置、注意事項)</label>
        <textarea id="parkingText" placeholder="填寫自駕停車指引、停車場容量等..."></textarea>
    </div>
    <div class="input-group">
        <div class="form-group">
            <label for="musician" class="required">禮儀師姓名</label>
            <input type="text" id="musician" placeholder="陳大安" required>
        </div>
        <div class="form-group">
            <label for="musicianPhone" class="required">禮儀師電話</label>
            <input type="text" id="musicianPhone" placeholder="09XX-XXX-XXX" required>
        </div>
    </div>
    <div class="input-group">
        <div class="form-group">
            <label for="contactNameA">家屬聯絡人姓名</label>
            <input type="text" id="contactNameA" placeholder="王大明">
        </div>
        <div class="form-group">
            <label for="contactPhoneA">家屬聯絡人電話</label>
            <input type="text" id="contactPhoneA" placeholder="09XX-XXX-XXX">
        </div>
    </div>
    <div class="form-group">
        <label for="lineContactLink" class="required">LINE 聯絡網址</label>
        <input type="text" id="lineContactLink" placeholder="例如：https://line.me/ti/p/~@LINEID" required>
    </div>

    <h2 class="section-header">🖼️ 圖片與政策 (請填寫**路徑**或**網址**)</h2>
    <div class="form-group">
        <label for="deceasedPhoto">亡者追思照片路徑</label>
        <input type="text" id="deceasedPhoto" placeholder="例如：image/deceased/Wang.jpg">
        <p class="path-note">請確認檔案已上傳至伺服器。</p>
    </div>
    <div class="form-group">
        <label for="obituaryPaper">訃告紙本路徑 (點擊放大圖)</label>
        <input type="text" id="obituaryPaper" placeholder="例如：image/paper/paper_final.png">
        <p class="path-note">請確認檔案已上傳至伺服器。</p>
    </div>
    <div class="form-group">
        <label for="musicPath">背景音樂路徑 (.mp3 或 .ogg)</label>
        <input type="text" id="musicPath" placeholder="例如：audio/peace.mp3">
        <p class="path-note">請確認檔案已上傳至伺服器。</p>
    </div>
    <div class="form-group">
        <label for="unifiedFlower">花籃政策</label>
        <select id="unifiedFlower">
            <option value="否">開放自由致贈花籃</option>
            <option value="是">統一製作花籃 (不開放自行訂購)</option>
        </select>
    </div>
    <div class="form-group">
        <label for="flowerStylesCodes">花籃樣式代碼 (英文大寫, 逗號分隔)</label>
        <input type="text" id="flowerStylesCodes" placeholder="例如：A, B, C, F, H">
    </div>

    <h2 class="section-header">📝 選填輔助資料</h2>
    <div class="form-group">
        <label for="obituaryThanks">訃告結尾感謝詞 (每行一句，會自動換段)</label>
        <textarea id="obituaryThanks" placeholder="治喪期間，諸多不便，敬請諒解。
衷心感謝親友的慰問與陪伴，家人們銘記在心。"></textarea>
    </div>
    <div class="form-group">
        <label for="businessCardImg">公司名片/QR Code 圖片路徑</label>
        <input type="text" id="businessCardImg" placeholder="例如：image/card/business.png">
    </div>
    <div class="form-group">
        <label for="responsiblePersonImg">禮儀師/負責人照片路徑 (頁腳)</label>
        <input type="text" id="responsiblePersonImg" placeholder="例如：image/staff/musician.jpg">
    </div>
    <div class="form-group">
        <label for="footerCompanyName">禮儀公司名稱 (頁腳)</label>
        <input type="text" id="footerCompanyName" placeholder="祥安生命禮儀有限公司">
    </div>
    <div class="input-group">
        <div class="form-group">
            <label for="mapImg1">導引圖圖片路徑</label>
            <input type="text" id="mapImg1" placeholder="例如：image/transport/guide1.jpg">
        </div>
        <div class="form-group">
            <label for="mapImg2">停車資訊圖片路徑</label>
            <input type="text" id="mapImg2" placeholder="例如：image/transport/park2.jpg">
        </div>
    </div>


    <button id="generate-url">🚀 生成獨立網址與跳轉</button>

    <div class="result-box" style="display: none;">
        <h3>🔗 訃聞連結已生成</h3>
        <span id="result-url"></span>
        <div>
            <button id="copy-button">📋 複製連結</button>
            <button id="jump-button">🌐 開啟訃聞頁面</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const generateBtn = document.getElementById('generate-url');
    const resultUrlSpan = document.getElementById('result-url');
    const resultBox = document.querySelector('.result-box');
    const copyBtn = document.getElementById('copy-button');
    const jumpBtn = document.getElementById('jump-button');
    
    // --- 地點資料庫 (含詳細交通資訊) ---
    const LOCATION_DATA = {
        banqiao: {
            verticalAddress: "新北板橋殯儀館",
            address: "新北市板橋區新海路135號",
            funeralLocationDefault: "新北板橋殯儀館 - 景福廳",
            mapIframeLink: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3615.118742468762!2d121.46465497500581!3d25.03332158434725!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a819c9b0e251%3A0xf639a038c119d67!2z5paw5YyX5qSc544q5rqd6L-Y5ZyS6aag!5e0!3m2!1szh-TW!2stw!4v1703050000000!5m2!1szh-TW!2stw", // 範例連結
            thanks: "治喪期間，諸多不便，敬請諒解。\n衷心感謝親友的慰問與陪伴，家人們銘記在心。",
            mapImg1: "image/transport/banqiao_guide.jpg", 
            mapImg2: "image/transport/banqiao_park.jpg",
            transportText: "【大眾運輸】\n捷運/火車：搭乘至板橋站後，轉乘計程車或公車（310, 307, 786, 810, 857, F501 等）至新海路站牌下車，步行約 5 分鐘。",
            parkingText: "【停車資訊】\n館內設有地下停車場（新海路出入口），車位有限，建議搭乘大眾運輸工具。周邊亦有收費停車場或停車格可供利用。"
        },
        sec_taipei: {
            verticalAddress: "台北市第二殯儀館",
            address: "臺北市大安區辛亥路三段330號",
            funeralLocationDefault: "臺北市第二殯儀館 - 景仰廳",
            mapIframeLink: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3615.4223253723386!2d121.54512477500547!3d25.022938884358826!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a9b369c0d381%3A0x7d6b38c0e2567994!2z5Y-w5YyX5biC576O5L6K5rqd6L-Y5ZyS6aag!5e0!3m2!1szh-TW!2stw!4v1703050000000!5m2!1szh-TW!2stw", // 範例連結
            thanks: "治喪期間，諸多不便，敬請諒解。\n衷心感謝親友的慰問與陪伴，家人們銘記在心。",
            mapImg1: "image/transport/erbin_guide.jpg",
            mapImg2: "image/transport/erbin_park.jpg",
            transportText: "【大眾運輸】\n捷運：搭乘文湖線至六張犁站或辛亥站，步行約 15 分鐘或轉搭接駁車。\n免費接駁車：富德線、辛亥線皆有接駁服務，詳情請參閱臺北市殯葬處網站。",
            parkingText: "【停車資訊】\n二殯設有地下停車場，但車位極為有限，尖峰時段一位難求。建議多加利用大眾運輸工具及接駁車。"
        },
        taoyuan: {
            verticalAddress: "桃園市殯葬園區",
            address: "桃園市桃園區大有路896號",
            funeralLocationDefault: "桃園市殯葬園區 - 懷德廳",
            mapIframeLink: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3610.1501193393144!2d121.31976697501062!3d25.21041938435163!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34682029c78d5231%3A0x9d09c2a8f8101416!2z5q-q5bGv5YyX5biC5rqd6L-Y5ZyS5ZyS6aag!5e0!3m2!1szh-TW!2stw!4v1703050000000!5m2!1szh-TW!2stw", // 範例連結
            thanks: "治喪期間，諸多不便，敬請諒解。\n衷心感謝親友的慰問與陪伴，家人們銘記在心。",
            mapImg1: "image/transport/taoyuan_guide.jpg",
            mapImg2: "image/transport/taoyuan_park.jpg",
            transportText: "【大眾運輸】\n火車：搭乘至桃園車站後，轉乘計程車或市區公車（L111A, L111B）至園區站牌下車。",
            parkingText: "【停車資訊】\n園區設有平面停車場，車位較為充裕。請依照工作人員或標示引導停放。"
        },
        zhongli: {
            verticalAddress: "中壢御殿園",
            address: "桃園市中壢區培英路356號",
            funeralLocationDefault: "中壢御殿園 - A廳",
            mapIframeLink: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3618.35330366627!2d121.22810897500171!3d24.919799484370215!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3468224523773193%3A0x26c04f98124b8d76!2z5Lit5Zub5Z6J5Z6p5ZyS!5e0!3m2!1szh-TW!2stw!4v1703050000000!5m2!1szh-TW!2stw", // 範例連結
            thanks: "治喪期間，諸多不便，敬請諒解。\n衷心感謝親友的慰問與陪伴，家人們銘記在心。",
            mapImg1: "image/transport/zhongli_guide.jpg",
            mapImg2: "image/transport/zhongli_park.jpg",
            transportText: "【大眾運輸】\n火車：搭乘至中壢車站，轉乘計程車約 15 分鐘可達。\n公車：目前無直達公車，建議搭乘計程車或自駕前往。",
            parkingText: "【停車資訊】\n御殿園設有大型免費停車場，提供充裕車位，不需擔心停車問題。"
        },
        custom: {
            // 保持清空，讓用戶手動輸入
            verticalAddress: "", address: "", funeralLocationDefault: "", mapIframeLink: "", 
            thanks: "治喪期間，諸多不便，敬請諒解。\n衷心感謝親友的慰問與陪伴，家人們銘記在心。",
            mapImg1: "", mapImg2: "", transportText: "", parkingText: ""
        }
    };
    // ----------------------
    
    // 預設填入範例路徑 (未被地點資料庫覆蓋的欄位)
    document.getElementById('deceasedPhoto').value = "image/deceased/sample.jpg";
    document.getElementById('obituaryPaper').value = "image/paper/sample_paper.png";
    document.getElementById('musicPath').value = "audio/default_bgm.mp3";
    document.getElementById('businessCardImg').value = "image/card/sample_card.png";
    document.getElementById('responsiblePersonImg').value = "image/staff/sample_person.jpg";
    document.getElementById('footerCompanyName').value = "祥安生命禮儀有限公司";

    /**
     * 根據選擇的地點自動填寫相關資訊
     */
    window.autoFillLocation = function() {
        const selectedKey = document.getElementById('locationPreset').value;
        const data = LOCATION_DATA[selectedKey];

        if (data) {
            // 自動填寫核心地址資訊
            document.getElementById('verticalAddress').value = data.verticalAddress;
            document.getElementById('verticalAddressDetail').value = data.address;
            document.getElementById('contactAddress').value = data.address;
            document.getElementById('funeralLocation').value = data.funeralLocationDefault;
            document.getElementById('mapIframeLink').value = data.mapIframeLink;
            
            // 自動填寫交通、感謝詞與交通圖路徑
            document.getElementById('transportText').value = data.transportText; // 新增
            document.getElementById('parkingText').value = data.parkingText;   // 新增
            document.getElementById('obituaryThanks').value = data.thanks;
            document.getElementById('mapImg1').value = data.mapImg1;
            document.getElementById('mapImg2').value = data.mapImg2;
            
            // 如果是自訂，清除所有輸入欄位以利手動輸入
            if (selectedKey === 'custom') {
                 document.getElementById('verticalAddress').value = "";
                 document.getElementById('verticalAddressDetail').value = "";
                 document.getElementById('contactAddress').value = "";
                 document.getElementById('funeralLocation').value = "";
                 document.getElementById('mapIframeLink').value = "";
                 document.getElementById('transportText').value = ""; // 清空
                 document.getElementById('parkingText').value = "";   // 清空
            }
        }
    };
    
    /**
     * 核心編碼邏輯函式 (保護/混淆處理)
     * 將資料轉為 JSON -> 處理中文 Base64 -> URL 編碼
     */
    const CORE_ENCODER_LOGIC = (function() {
        // 使用陣列混淆 base_url
        const BASE_PATH = ["f", "u", "b", "e", "n", "_", "d", "i", "s", "p", "l", "a", "y", ".", "h", "t", "m", "l", "?", "d", "a", "t", "a", "="];
        
        return function(d) {
            let j, b, u, base_url;
            try {
                // 1. JSON 序列化
                j = JSON.stringify(d);
                
                // 2. Base64 編碼 (包含對中文/Unicode的處理)
                // 核心保護：使用字串索引呼叫 window.btoa，並使用 unescape 處理中文，使程式碼不易閱讀。
                b = window['btoa'](unescape(encodeURIComponent(j)));
                
                // 3. URL 編碼 (對 Base64 結果進行編碼)
                u = encodeURIComponent(b);
                
                // 4. 構建 URL
                base_url = BASE_PATH.join(''); // 使用 join 混淆路徑字串
                return base_url + u;
            } catch (e) {
                console.error("生成連結失敗:", e);
                alert("生成連結失敗，請檢查輸入數據是否包含無效字符。");
                return null;
            }
        };
    })();
    
    // 按鈕事件處理
    generateBtn.addEventListener('click', function() {
        // --- 檢查必填欄位 ---
        const requiredFields = [
            'name', 'age', 'deathDate', 'funeralDate', 'jiadianTimePhrase', 
            'gongdianTimePhrase', 'funeralLocation', 'contactAddress', 
            'musician', 'musicianPhone', 'lineContactLink'
        ];
        
        for (const fieldId of requiredFields) {
            if (!document.getElementById(fieldId).value.trim()) {
                alert("請填寫所有標記為 * 的必填欄位！");
                document.getElementById(fieldId).focus();
                return;
            }
        }
        // ------------------


        const data = {
            // 亡者與日期
            name: document.getElementById('name').value.trim(),
            age: document.getElementById('age').value.trim(),
            deathDate: document.getElementById('deathDate').value,
            deathLunarDate: document.getElementById('deathLunarDate').value.trim(),
            
            // 喪禮資訊
            funeralDate: document.getElementById('funeralDate').value,
            jiadianTimePhrase: document.getElementById('jiadianTimePhrase').value.trim(),
            gongdianTimePhrase: document.getElementById('gongdianTimePhrase').value.trim(),
            
            // 地點與聯絡人
            verticalAddress: document.getElementById('verticalAddress').value.trim(),
            verticalAddressDetail: document.getElementById('verticalAddressDetail').value.trim(),
            funeralLocation: document.getElementById('funeralLocation').value.trim(),
            contactAddress: document.getElementById('contactAddress').value.trim(),
            mapIframeLink: document.getElementById('mapIframeLink').value.trim(),
            
            // 交通資訊 (新增欄位)
            transportText: document.getElementById('transportText').value.trim(), 
            parkingText: document.getElementById('parkingText').value.trim(), 

            musician: document.getElementById('musician').value.trim(),
            musicianPhone: document.getElementById('musicianPhone').value.trim(),
            contactNameA: document.getElementById('contactNameA').value.trim(),
            contactPhoneA: document.getElementById('contactPhoneA').value.trim(),
            lineContactLink: document.getElementById('lineContactLink').value.trim(),
            
            // 圖片與政策 (只傳輸路徑/URL，避免長度問題)
            deceasedPhoto: document.getElementById('deceasedPhoto').value.trim(),
            obituaryPaper: document.getElementById('obituaryPaper').value.trim(),
            musicPath: document.getElementById('musicPath').value.trim(),
            unifiedFlower: document.getElementById('unifiedFlower').value,
            flowerStylesCodes: document.getElementById('flowerStylesCodes').value.trim(),

            // 選填輔助資料
            obituaryThanks: document.getElementById('obituaryThanks').value.trim(),
            businessCardImg: document.getElementById('businessCardImg').value.trim(),
            responsiblePersonImg: document.getElementById('responsiblePersonImg').value.trim(),
            footerCompanyName: document.getElementById('footerCompanyName').value.trim(),
            mapImg1: document.getElementById('mapImg1').value.trim(),
            mapImg2: document.getElementById('mapImg2').value.trim(),
        };
        
        // 使用保護過的編碼邏輯
        const finalUrl = CORE_ENCODER_LOGIC(data);

        if (finalUrl) {
            // 顯示完整的網址 (包括目前的協定和域名)
            resultUrlSpan.textContent = window.location.origin + window.location.pathname.replace('index.html', '') + finalUrl;
            resultBox.style.display = 'block';
            
            // 綁定跳轉按鈕事件
            jumpBtn.onclick = function() {
                // 直接使用相對路徑 URL 跳轉
                window.open(finalUrl, '_blank');
            };
        }
    });

    // 複製按鈕事件
    copyBtn.addEventListener('click', function() {
        const urlToCopy = resultUrlSpan.textContent;
        navigator.clipboard.writeText(urlToCopy).then(() => {
            alert("連結已成功複製到剪貼板！");
        }).catch(err => {
            console.error('複製失敗:', err);
            alert("複製失敗，請手動選取複製。");
        });
    });
});
</script>
