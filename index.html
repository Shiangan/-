<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>訃聞數據輸入頁 (URL 編碼版)</title>
    <style>
        /* 樣式保持不變 */
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { width: 100%; padding: 10px 0; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background-color: #f9f9f9; }
        button { display: block; width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; margin-top: 20px; cursor: pointer; font-size: 1.1em; }
        button:hover { background-color: #0056b3; }
        .section { border: 1px solid #ddd; padding: 15px; margin-top: 20px; border-radius: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px;}
        textarea { resize: vertical; }
        .hidden-url-box { margin-top: 20px; padding: 15px; background-color: #e6ffe6; border: 1px solid #00c300; border-radius: 4px; display: none; }
        .hidden-url-box p { font-weight: bold; margin-bottom: 10px; }
        .url-output { word-break: break-all; background-color: #fff; padding: 10px; border: 1px dashed #009900; border-radius: 4px; cursor: copy; }
    </style>
</head>
<body>
    <div class="container">
        <h1>訃聞內容輸入 (URL 編碼版)</h1>
        <form id="fubenForm">
            <div class="section">
                <h2>亡者資訊</h2>
                <label for="name">亡者姓名 (例如: 蕭甘月露夫人):</label>
                <input type="text" id="name" value="蕭甘月露夫人" required>
                <label for="age">享壽 (虛歲):</label>
                <input type="number" id="age" value="94" required>
                <label for="deathDate">辭世日期 (YYYY-MM-DD):</label>
                <input type="date" id="deathDate" value="2025-11-26" required>
                <label for="funeralDate">出殯日期 (YYYY-MM-DD):</label>
                <input type="date" id="funeralDate" value="2025-12-17" required>
                <label for="deathLunarDate">辭世農曆日期 (例如: 十月廿八日):</label>
                <input type="text" id="deathLunarDate" value="十月廿八日" required>
            </div>

            <div class="section">
                <h2>儀式與地點</h2>
                <label for="funeralLocation">出殯地點 (例如: 板橋殯儀館 崇仁廳):</label>
                <input type="text" id="funeralLocation" value="板橋殯儀館 崇仁廳" required>
                <label for="jiadianTimePhrase">家奠時間 (例如: 上午 七 時 四十分):</label>
                <input type="text" id="jiadianTimePhrase" value="上午 七 時 四十分" required>
                <label for="gongdianTimePhrase">公奠時間 (例如: 上午 八 時 五十 分):</label>
                <input type="text" id="gongdianTimePhrase" value="上午 八 時 五十 分" required>
                <label for="contactAddress">出殯地點地址 (詳細):</label>
                <input type="text" id="contactAddress" value="220新北市板橋區中正路560號" required>
                <label for="verticalAddress">豎靈地點 (例如: 龍華會館 1F牌位區 [ 73號 ]):</label>
                <input type="text" id="verticalAddress" value="龍華會館 1F牌位區 [ 73號 ]" required>
                <label for="verticalAddressDetail">豎靈地點地址 (詳細):</label>
                <input type="text" id="verticalAddressDetail" value="220新北市板橋區長江路一段7號" required>
            </div>

            <div class="section">
                <h2>聯絡人、禮儀師與連結</h2>
                <div class="grid-2">
                    <div>
                        <label for="contactNameA">家屬聯絡人姓名 (例如: 志順):</label>
                        <input type="text" id="contactNameA" value="志順" required>
                        <label for="contactPhoneA">家屬聯絡人電話 (ex: 0953-825-426):</label>
                        <input type="text" id="contactPhoneA" value="0953-825-426" required>
                    </div>
                    <div>
                        <label for="musician">禮儀師姓名:</label>
                        <input type="text" id="musician" value="陳柏元" required>
                        <label for="musicianPhone">禮儀師電話 (24小時專線 ex: 0938-179-858):</label>
                        <input type="text" id="musicianPhone" value="0938-179-858" required>
                    </div>
                </div>
                <label for="mapIframeLink">Google Maps 嵌入連結 (iframe src):</label>
                <textarea id="mapIframeLink" rows="3" required>https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3615.115456956247!2d121.4552458!3d25.0300185!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a8b98f24458f%3A0x6a2c22e4d0c28340!2z6Ie65q-C56u55LiA6IK-5b-g!5e0!3m2!1szh-TW!2stw!4v1703031070213!5m2!1szh-TW!2stw</textarea>
                <label for="lineContactLink">LINE 聯絡連結:</label>
                <input type="text" id="lineContactLink" value="https://line.me/ti/p/nZJmE8-b6X" required>
            </div>
            
            <div class="section">
                <h2>圖片與媒體上傳 (❗請點擊上傳檔案❗)</h2>
                
                <label for="deceasedPhotoFile">亡者追思照片 (上傳檔案):</label>
                <input type="file" id="deceasedPhotoFile" accept="image/*">
                <input type="hidden" id="deceasedPhoto" value="image/IMG_3696.jpeg">

                <label for="obituaryPaperFile">訃聞紙本照片 (上傳檔案):</label>
                <input type="file" id="obituaryPaperFile" accept="image/*">
                <input type="hidden" id="obituaryPaper" value="image/IMG_4092.jpeg">

                <label for="businessCardImgFile">禮儀公司名片 (上傳檔案):</label>
                <input type="file" id="businessCardImgFile" accept="image/*">
                <input type="hidden" id="businessCardImg" value="image/未命名設計.png">

                <label for="responsiblePersonImgFile">負責人/禮儀師照片 (上傳檔案):</label>
                <input type="file" id="responsiblePersonImgFile" accept="image/*">
                <input type="hidden" id="responsiblePersonImg" value="image/IMG_8349.jpeg">

                <label for="mapImg1File">交通資訊圖 1 (上傳檔案):</label>
                <input type="file" id="mapImg1File" accept="image/*">
                <input type="hidden" id="mapImg1" value="image/IMG_6325.png">

                <label for="mapImg2File">交通資訊圖 2 (上傳檔案):</label>
                <input type="file" id="mapImg2File" accept="image/*">
                <input type="hidden" id="mapImg2" value="image/祥安資訊-板殯.png">
                
                <label for="musicFile">背景音樂 (MP3/OGG):</label>
                <input type="file" id="musicFile" accept="audio/mp3, audio/ogg">
            </div>

            <div class="section">
                <h2>花籃訂購與自訂文字</h2>
                <label for="unifiedFlower">是否採統一製作花籃?</label>
                <select id="unifiedFlower" required>
                    <option value="是">是 (統一製作，不接受外部花禮)</option>
                    <option value="否" selected>否 (開放選擇樣式)</option>
                </select>
                <label>可供選擇的花籃樣式代碼 (例如: A,B,C,D,E,F,G,H, 用逗號分隔):</label>
                <input type="text" id="flowerStylesCodes" value="A,B,C,D,E,F,G,H">
                <label for="obituaryThanks">感謝親友自訂文字 (可用換行分隔段落):</label>
                <textarea id="obituaryThanks" rows="5">感謝親友們在這段時間的慰問與關心
您的關懷和鼓勵
陪伴我們度過了這段艱難的時光
敬邀您
與我們一同追思懷念[亡者姓名]
並向您獻上最深的敬意
謝謝您！</textarea>
                <label for="footerCompanyName">頁腳公司名稱:</label>
                <input type="text" id="footerCompanyName" value="祥安生命有限公司">
            </div>

            <button type="submit">生成獨立網址與跳轉</button>
        </form>

        <div id="result-box" class="hidden-url-box">
            <p>✅ **請複製以下連結，這個就是家屬專屬的訃聞網址：**</p>
            <div id="generated-url" class="url-output"></div>
            <p style="margin-top: 10px;">(點擊網址即可複製)</p>
            <button id="copy-and-go-btn" style="background-color: #28a745; margin-top: 10px;">點擊複製並開啟訃聞</button>
        </div>
    </div>

    <script>
    // --- 輔助函式：取得檔案輸入 ---
    function getFile(id) {
        const fileInput = document.getElementById(id);
        return fileInput.files[0];
    }
    
    // --- 媒體檔案 ID 列表 ---
    const mediaFileIds = [
        'deceasedPhotoFile', 'obituaryPaperFile', 'businessCardImgFile', 
        'responsiblePersonImgFile', 'mapImg1File', 'mapImg2File', 'musicFile'
    ];
    
    // --- 表單提交處理 ---
    document.getElementById('fubenForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        // ----------------------------------------------------
        // 1. 處理所有媒體檔案 (圖片和音樂) 為 Base64 字串
        // ----------------------------------------------------
        
        const data = {};
        const filesToProcess = mediaFileIds.filter(id => getFile(id));
        let processedCount = 0;
        
        // 收集所有文字數據
        data.name = document.getElementById('name').value;
        data.age = document.getElementById('age').value;
        data.deathDate = document.getElementById('deathDate').value;
        data.funeralDate = document.getElementById('funeralDate').value;
        data.deathLunarDate = document.getElementById('deathLunarDate').value;
        data.funeralLocation = document.getElementById('funeralLocation').value;
        data.jiadianTimePhrase = document.getElementById('jiadianTimePhrase').value;
        data.gongdianTimePhrase = document.getElementById('gongdianTimePhrase').value;
        data.contactAddress = document.getElementById('contactAddress').value;
        data.verticalAddress = document.getElementById('verticalAddress').value;
        data.verticalAddressDetail = document.getElementById('verticalAddressDetail').value;
        data.contactNameA = document.getElementById('contactNameA').value;
        data.contactPhoneA = document.getElementById('contactPhoneA').value;
        data.musician = document.getElementById('musician').value;
        data.musicianPhone = document.getElementById('musicianPhone').value;
        data.mapIframeLink = document.getElementById('mapIframeLink').value;
        data.lineContactLink = document.getElementById('lineContactLink').value;
        data.unifiedFlower = document.getElementById('unifiedFlower').value;
        data.flowerStylesCodes = document.getElementById('flowerStylesCodes').value;
        data.obituaryThanks = document.getElementById('obituaryThanks').value;
        data.footerCompanyName = document.getElementById('footerCompanyName').value;

        // 處理沒有檔案上傳的情況
        if (filesToProcess.length === 0) {
            // 使用預設路徑 (隱藏欄位值)
            data.deceasedPhoto = document.getElementById('deceasedPhoto').value;
            data.obituaryPaper = document.getElementById('obituaryPaper').value;
            data.businessCardImg = document.getElementById('businessCardImg').value;
            data.responsiblePersonImg = document.getElementById('responsiblePersonImg').value;
            data.mapImg1 = document.getElementById('mapImg1').value;
            data.mapImg2 = document.getElementById('mapImg2').value;
            data.musicPath = ''; 
            
            generateUrlAndDisplay(data);
            return;
        }

        // 處理檔案上傳
        filesToProcess.forEach(fileId => {
            const file = getFile(fileId);
            const dataKey = fileId.replace('File', '').replace('Photo', ''); 
            
            const reader = new FileReader();
            reader.onload = function(event) {
                data[dataKey] = event.target.result; // Base64 字串
                processedCount++;
                
                // 檢查所有檔案是否都已處理完成
                if (processedCount === filesToProcess.length) {
                    
                    // 處理未上傳的圖片：使用預設路徑
                    if (!data.deceased) data.deceasedPhoto = document.getElementById('deceasedPhoto').value;
                    else data.deceasedPhoto = data.deceased;

                    if (!data.obituaryPaper) data.obituaryPaper = document.getElementById('obituaryPaper').value;
                    if (!data.businessCardImg) data.businessCardImg = document.getElementById('businessCardImg').value;
                    if (!data.responsiblePersonImg) data.responsiblePersonImg = document.getElementById('responsiblePersonImg').value;
                    if (!data.mapImg1) data.mapImg1 = document.getElementById('mapImg1').value;
                    if (!data.mapImg2) data.mapImg2 = document.getElementById('mapImg2').value;
                    
                    if (!data.music) data.musicPath = ''; 
                    else data.musicPath = data.music; // 將 music Base64 賦值給 musicPath

                    // 刪除臨時的 key
                    delete data.deceased;
                    delete data.music;
                    
                    generateUrlAndDisplay(data);
                }
            };
            reader.onerror = function(error) {
                console.error(`讀取檔案 ${fileId} 失敗:`, error);
                // 如果失敗，則使用預設路徑
                const defaultKey = fileId.replace('File', '');
                data[defaultKey] = document.getElementById(defaultKey).value;
                
                processedCount++;
                if (processedCount === filesToProcess.length) {
                    generateUrlAndDisplay(data);
                }
            };
            
            reader.readAsDataURL(file); 
        });
    });

    // ----------------------------------------------------
    // 2. 核心邏輯：生成 URL
    // ----------------------------------------------------
    function generateUrlAndDisplay(data) {
        try {
            // 步驟 A: 將 JavaScript 物件轉換為 JSON 字串
            const jsonStr = JSON.stringify(data);
            
            // 步驟 B: 使用 Base64 編碼，然後再進行 URL 編碼 (確保安全性)
            const base64Str = btoa(jsonStr); // Base64 編碼
            const urlEncodedData = encodeURIComponent(base64Str); // URL 編碼
            
            // 步驟 C: 構造最終的獨立網址
            const baseUrl = window.location.href.replace('index.html', 'fuben_display.html');
            const finalUrl = `${baseUrl}?data=${urlEncodedData}`;
            
            // 步驟 D: 顯示給使用者
            const urlOutputDiv = document.getElementById('generated-url');
            urlOutputDiv.textContent = finalUrl;
            document.getElementById('result-box').style.display = 'block';
            
            // 綁定複製事件
            urlOutputDiv.onclick = function() {
                navigator.clipboard.writeText(finalUrl).then(() => {
                    alert('訃聞網址已複製到剪貼簿！');
                });
            };

            // 綁定複製並開啟按鈕
            document.getElementById('copy-and-go-btn').onclick = function() {
                 navigator.clipboard.writeText(finalUrl).then(() => {
                    window.location.href = finalUrl; 
                 });
            };
            
        } catch (e) {
            console.error("網址生成失敗，資料可能過長：", e);
            alert("網址生成失敗，可能因 Base64 數據過長超出瀏覽器極限。請嘗試使用較小的圖片。");
        }
    }
    </script>
</body>
</html>
