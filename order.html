<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>花籃線上訂購 - [亡者姓名]</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f7f7f7; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .flower-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .flower-item { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fff; }
        .flower-item.selected { border-color: #007bff; border-width: 3px; box-shadow: 0 0 10px rgba(0, 123, 255, 0.3); }
        .flower-item img { max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 10px; }
        .flower-item h3 { margin: 5px 0; font-size: 1.2em; }
        .flower-item p { color: #e74c3c; font-weight: bold; }
        
        .order-form, .summary { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"], textarea {
            width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        #totalPrice { font-size: 1.5em; color: #2ecc71; font-weight: bold; margin-top: 10px; }
        button {
            display: block; width: 100%; padding: 15px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; margin-top: 30px; cursor: pointer; font-size: 1.2em;
        }
        button:hover { background-color: #27ae60; }
        .quantity-control { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .quantity-control button { width: 40px; height: 40px; padding: 0; margin: 0; background-color: #eee; color: #333; border: 1px solid #ccc; font-size: 1.5em; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="orderTitle">花籃線上訂購 - [動態:亡者姓名]</h1>
        
        <h2>步驟一：選擇花籃樣式 (價格為一對)</h2>
        <div class="flower-options" id="flowerOptions">
            </div>

        <div class="order-form">
            <h2>步驟二：填寫訂購資訊</h2>
            <form id="orderForm">
                <label for="orderName">訂購人/致贈人姓名:</label>
                <input type="text" id="orderName" required placeholder="例如: XXX 公司全體同仁 或 摯友 XXX">
                
                <label for="contactTel">聯絡電話:</label>
                <input type="text" id="contactTel" required placeholder="例如: 09XX-XXX-XXX">
                
                <label for="contactEmail">電子郵件:</label>
                <input type="email" id="contactEmail" placeholder="用於接收訂單確認信 (選填)">

                <label for="dedication">花籃輓詞/致意 (選填):</label>
                <textarea id="dedication" rows="2" placeholder="例如: 永懷德澤、音容宛在"></textarea>
                
                <div class="summary">
                    <h3>訂單總結</h3>
                    <p id="selectedFlower">已選花籃: 無</p>
                    <div class="quantity-control">
                        <label for="quantity" style="margin: 0;">數量 (對):</label>
                        <button type="button" onclick="changeQuantity(-1)">-</button>
                        <input type="number" id="quantity" value="1" min="1" style="width: 60px; text-align: center;" required onchange="updateTotal()">
                        <button type="button" onclick="changeQuantity(1)">+</button>
                    </div>
                    <p>總金額 (一對價格 × 數量): <span id="totalPrice">NT$ 0</span></p>
                </div>
                
                <button type="submit">前往付款</button>
            </form>
        </div>
    </div>

    <script>
        // 預設的花籃數據
        const FLOWER_DATA = {
            'A': { price: 2500, img: 'image/花籃A款.JPG', desc: 'A款' },
            'B': { price: 3000, img: 'image/花籃B款.JPG', desc: 'B款' },
            'C': { price: 3500, img: 'image/花籃C款.JPG', desc: 'C款' },
            'D': { price: 4500, img: 'image/花籃D款.JPG', desc: 'D款' },
            'E': { price: 5000, img: 'image/花籃E款.JPG', desc: 'E款' },
            'F': { price: 5500, img: 'image/花籃F款.JPG', desc: 'F款' },
            'G': { price: 6000, img: 'image/花籃G款.JPG', desc: 'G款' },
            'H': { price: 6500, img: 'image/花籃H款.JPG', desc: 'H款' }
        };

        let selectedStyle = null;
        let flowerData = null;

        function renderFlowerOptions() {
            const storedData = localStorage.getItem('fubenData');
            if (!storedData) {
                document.getElementById('flowerOptions').innerHTML = '<p>錯誤：無法載入訃聞數據。</p>';
                return;
            }
            flowerData = JSON.parse(storedData);
            document.getElementById('orderTitle').textContent = `花籃線上訂購 - ${flowerData.name}${flowerData.gender === '女' ? '女士' : '先生'}`;

            const availableStyles = flowerData.flowerStyles.split(',').map(s => s.trim());
            const optionsContainer = document.getElementById('flowerOptions');
            optionsContainer.innerHTML = '';

            availableStyles.forEach(style => {
                const data = FLOWER_DATA[style];
                if (data) {
                    const item = document.createElement('div');
                    item.className = 'flower-item';
                    item.setAttribute('data-style', style);
                    item.innerHTML = `
                        <img src="${data.img}" alt="${data.desc}">
                        <h3>${data.desc}</h3>
                        <p>NT$ ${data.price.toLocaleString()} / 對</p>
                    `;
                    item.addEventListener('click', () => selectFlower(style));
                    optionsContainer.appendChild(item);
                }
            });
            
            // 預設選中第一個可用的樣式
            if (availableStyles.length > 0) {
                selectFlower(availableStyles[0]);
            }
        }

        function selectFlower(style) {
            if (selectedStyle) {
                document.querySelector(`[data-style="${selectedStyle}"]`).classList.remove('selected');
            }
            selectedStyle = style;
            document.querySelector(`[data-style="${selectedStyle}"]`).classList.add('selected');
            updateTotal();
        }

        function changeQuantity(change) {
            const quantityInput = document.getElementById('quantity');
            let current = parseInt(quantityInput.value);
            current += change;
            if (current < 1) current = 1;
            quantityInput.value = current;
            updateTotal();
        }

        function updateTotal() {
            const style = selectedStyle;
            const quantity = parseInt(document.getElementById('quantity').value);
            const priceEl = document.getElementById('totalPrice');
            const selectedFlowerEl = document.getElementById('selectedFlower');

            if (!style || !FLOWER_DATA[style]) {
                priceEl.textContent = 'NT$ 0';
                selectedFlowerEl.textContent = '已選花籃: 無';
                return;
            }

            const unitPrice = FLOWER_DATA[style].price;
            const total = unitPrice * quantity;

            selectedFlowerEl.textContent = `已選花籃: ${FLOWER_DATA[style].desc} (單價 NT$ ${unitPrice.toLocaleString()}/對)`;
            priceEl.textContent = `NT$ ${total.toLocaleString()}`;
            
            // 儲存當前訂單資訊到 localStorage (暫時儲存)
            const currentOrder = {
                style: style,
                quantity: quantity,
                unitPrice: unitPrice,
                total: total
            };
            localStorage.setItem('currentOrder', JSON.stringify(currentOrder));
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!selectedStyle) {
                alert('請先選擇花籃樣式！');
                return;
            }

            // 收集訂單人資訊
            const orderDetails = {
                orderName: document.getElementById('orderName').value,
                contactTel: document.getElementById('contactTel').value,
                contactEmail: document.getElementById('contactEmail').value,
                dedication: document.getElementById('dedication').value,
            };
            
            const currentOrder = JSON.parse(localStorage.getItem('currentOrder'));
            
            // 完整訂單數據
            const finalOrderData = {
                deceasedInfo: {
                    name: flowerData.name,
                    location: flowerData.funeralLocation
                },
                order: currentOrder,
                customer: orderDetails,
                timestamp: new Date().toISOString()
            };

            // 存入 localStorage，準備跳轉到付款頁
            localStorage.setItem('finalOrderData', JSON.stringify(finalOrderData));

            // 跳轉到付款頁
            window.location.href = 'payment.html';
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', renderFlowerOptions);
    </script>
</body>
</html>
